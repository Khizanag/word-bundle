# SwiftLint configuration for Word Bundle. The rules live in ios-toolkit; this
# file adds this app's paths, its own exemptions, and the debt it has yet to pay.
# Run `swiftlint --strict` — it must pass with zero violations before any commit.

parent_config: https://raw.githubusercontent.com/Khizanag/ios-toolkit/v1.0.0/swiftlint/base.yml

included:
  - Word Bundle
  - Packages

excluded:
  - Carthage
  - Pods

disabled_rules:
  # This app's own exemptions.
  - nesting
  - weak_delegate
  - implicit_getter
  - no_space_in_method_call
  # Debt — violations that exist today, with their counts. Fix the code, then
  # delete the line; the governance audit counts what is left.
  - line_length                      # 26
  - trailing_comma                   # 14
  - force_unwrapping                 # 8
  - extension_requires_mark          # 7
  - no_navigation_link               # 6
  - no_empty_line_after_doc_comment  # 4
  - no_inline_font                   # 3
  - sorted_imports                   # 2
  - number_separator                 # 1
